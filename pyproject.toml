[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pointpca2"
version = "0.5.2"
description = "A Rust-based Python library for extracting pointpca2 features from Point Clouds."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.26", "toml>=0.10.0"]

[project.urls]
repository = "https://github.com/arthurhscarvalho/pointpca2-pylib"

[tool.maturin]
python-source = "python"

[dependency-groups]
dev = [
    "maturin>=1.8.3,<2.0",
    "patchelf>=0.17.2.1; sys_platform == 'linux'",
]
examples = [
    # Retain Intel macOS wheels and the lower Linux glibc requirement.
    "open3d>=0.19.0,<0.20",
    # Open3D 0.19 omits this Linux/Windows requirement from its macOS metadata.
    "ipywidgets>=8.0.4; sys_platform == 'linux' or sys_platform == 'win32'",
]
